[build-system]
requires = ["setuptools>=68", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab-factory-tasks"
version = "0.1.0"
description = "Refactored standalone IsaacLab Factory PegInsert direct task."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flatdict==4.0.1",
    "gym==0.23.1",
    "gymnasium",
    "h5py",
    "hydra-core",
    "isaacsim[all,extscache]==5.1.0.0",
    "numpy<2",
    "prettytable",
    "protobuf>=4.25.8,!=5.26.0",
    "PyYAML",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "toml",
    "torch>=2.7",
]

[tool.setuptools]
package-dir = {"" = "source"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["source"]

[tool.setuptools.package-data]
"isaaclab_factory_tasks.direct.peg_insert.agents" = ["*.yaml"]
