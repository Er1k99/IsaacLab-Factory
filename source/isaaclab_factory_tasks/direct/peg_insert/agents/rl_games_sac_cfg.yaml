params:
  seed: 42

  algo:
    name: sac

  env:
    clip_observations: 10.0
    clip_actions: 1.0
    obs_groups:
      obs: [policy]
      states: [critic]
    concate_obs_groups: True

  model:
    name: factory_soft_actor_critic

  network:
    name: factory_soft_actor_critic
    separate: True

    space:
      continuous:

    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default

    log_std_bounds: [-5, 2]

  load_checkpoint: False
  load_path: ""

  config:
    name: FactoryPegInsertSAC
    device: cuda:0
    device_name: cuda:0
    full_experiment_name: ""
    env_name: rlgpu
    multi_gpu: False
    normalize_input: True

    reward_shaper:
      scale_value: 1.0

    max_epochs: 800
    num_steps_per_episode: 32
    save_best_after: 20
    save_frequency: 50

    gamma: 0.995
    init_alpha: 0.15
    alpha_lr: 1.0e-4
    actor_lr: 1.0e-4
    critic_lr: 3.0e-4
    critic_tau: 0.005

    batch_size: 1024
    learnable_temperature: True
    num_warmup_steps: 16
    replay_buffer_size: 500000
    num_actors: 128

    player:
      deterministic: False
